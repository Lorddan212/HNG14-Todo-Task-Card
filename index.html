<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daniel J Todo Task Card</title>
    <style>
      :root {
        --page-a: #f8efe3;
        --page-b: #edf6f3;
        --card: #fffbf5;
        --ink: #1f2937;
        --muted: #647084;
        --line: rgba(79, 94, 113, 0.18);
        --focus: #0f766e;
        --shadow: 0 22px 55px rgba(69, 54, 37, 0.14);
        --low-bg: #f3e8ff;
        --low-text: #7e22ce;
        --medium-bg: #dbeafe;
        --medium-text: #1d4ed8;
        --high-bg: #fee2e2;
        --high-text: #b91c1c;
        --pending-bg: #fef3c7;
        --pending-text: #a16207;
        --progress-bg: #dbeafe;
        --progress-text: #1d4ed8;
        --done-bg: #dcfce7;
        --done-text: #15803d;
        --danger-bg: #fff1ef;
        --danger-text: #b42318;
        --tag-bg: #ecf5f2;
        --tag-text: #14532d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Aptos", "Segoe UI", "Trebuchet MS", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 8% 0%, rgba(255, 213, 168, 0.92), transparent 33%),
          radial-gradient(circle at 100% 100%, rgba(115, 196, 175, 0.56), transparent 34%),
          linear-gradient(180deg, var(--page-a), var(--page-b));
      }

      .page-shell {
        min-height: 100vh;
        place-items: center;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .hidden {
        display: none;
      }

      article[data-testid="test-todo-card"] {
        --accent: var(--high-text);
        width: min(100%, 520px);
        position: relative;
        overflow: hidden;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--card);
        box-shadow: var(--shadow);
        transition: all 0.3s ease;
      }

      article[data-testid="test-todo-card"]::before {
        content: "";
        position: absolute;
        inset: 0 auto auto 0;
        width: 100%;
        height: 7px;
        background: var(--accent);
      }

      article.priority-low {
        --accent: var(--low-text);
      }

      article.priority-medium {
        --accent: var(--medium-text);
      }

      article.priority-high {
        --accent: var(--high-text);
      }

      article.is-overdue {
        border-color: rgba(185, 28, 28, 0.32);
      }

      article.completed {
        background: rgba(255, 251, 245, 0.78);
      }

      .card-top,
      .control-row,
      .meta-row,
      .button-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .card-top {
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .complete-wrap {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 10px;
      }

      input[type="checkbox"][data-testid="test-todo-complete-toggle"] {
        width: 22px;
        height: 22px;
        margin: 0;
        accent-color: var(--done-text);
      }

      .complete-wrap label,
      .field label,
      .status-control label {
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 700;
      }

      .meta-row {
        justify-content: flex-end;
        flex-wrap: wrap;
      }

      .badge,
      .overdue-badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 12px;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .priority-dot {
        width: 13px;
        height: 13px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 16%, transparent);
      }

      .priority-low .priority-badge {
        background: var(--low-bg);
        color: var(--low-text);
      }

      .priority-medium .priority-badge {
        background: var(--medium-bg);
        color: var(--medium-text);
      }

      .priority-high .priority-badge {
        background: var(--high-bg);
        color: var(--high-text);
      }

      .status-pending {
        background: var(--pending-bg);
        color: var(--pending-text);
      }

      .status-progress {
        background: var(--progress-bg);
        color: var(--progress-text);
      }

      .status-done {
        background: var(--done-bg);
        color: var(--done-text);
      }

      .status-control {
        display: grid;
        gap: 6px;
        margin: 0 0 18px;
      }

      select,
      input,
      textarea {
        width: 100%;
        min-width: 0;
        border: 1px solid rgba(92, 109, 128, 0.28);
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.92);
        color: var(--ink);
        padding: 11px 13px;
        font: inherit;
      }

      select {
        background: linear-gradient(145deg, #ffffff, #f3f4f6);
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      select:hover {
        border-color: var(--focus);
        box-shadow: 0 4px 12px rgba(15, 118, 110, 0.12);
      }

      select:focus {
        border-color: var(--focus);
        box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.2);
      }

      h2[data-testid="test-todo-title"] {
        margin: 0;
        font-size: clamp(1.35rem, 4vw, 1.8rem);
        line-height: 1.15;
        overflow-wrap: anywhere;
      }

      .completed h2[data-testid="test-todo-title"] {
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-thickness: 2px;
        text-decoration-color: rgba(31, 41, 55, 0.35);
      }

      .collapsible-section {
        overflow: hidden;
        transition: max-height 0.2s ease;
      }

      .collapsible-section.is-collapsed {
        max-height: 4.9rem;
      }

      .collapsible-section.is-expanded {
        max-height: 40rem;
      }

      p[data-testid="test-todo-description"] {
        margin: 12px 0 0;
        color: var(--muted);
        line-height: 1.65;
        overflow-wrap: anywhere;
      }

      .expand-button {
        margin-top: 10px;
        min-width: 0;
        padding-inline: 0;
        border: 0;
        background: transparent;
        color: var(--focus);
      }

      .timeline {
        display: grid;
        gap: 8px;
        margin-top: 18px;
        padding: 14px 15px;
        border: 1px solid rgba(194, 65, 12, 0.16);
        border-radius: 18px;
        background: linear-gradient(180deg, #fff8ef, #f3ece4);
      }

      .timeline-label,
      time[data-testid="test-todo-time-remaining"] {
        color: #c2410c;
        font-weight: 800;
      }

      .completed time[data-testid="test-todo-time-remaining"] {
        color: var(--done-text);
    }

      .timeline-label {
        margin: 0;
        font-size: 0.77rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      time[data-testid="test-todo-due-date"] {
        font-weight: 800;
      }

      .overdue-badge {
        width: fit-content;
        background: var(--high-bg);
        color: var(--high-text);
      }

      .overdue-badge[hidden] {
        display: none;
      }

      ul[data-testid="test-todo-tags"] {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 18px 0 0;
        padding: 0;
        list-style: none;
      }

      ul[data-testid="test-todo-tags"] li {
        padding: 7px 12px;
        border-radius: 999px;
        background: var(--tag-bg);
        color: var(--tag-text);
        font-size: 0.84rem;
        font-weight: 800;
      }

      .button-row {
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid rgba(92, 109, 128, 0.12);
      }

      button {
        min-width: 122px;
        border: 1px solid rgba(36, 48, 65, 0.14);
        border-radius: 14px;
        background: #fff;
        color: #243041;
        padding: 11px 16px;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      button:hover {
        background: #f6efe6;
      }

      .danger-button {
        background: var(--danger-bg);
        color: var(--danger-text);
        border-color: rgba(180, 35, 24, 0.18);
      }

      .add-task-btn {
        min-width: 122px;
        border-radius: 14px;
        border: 1px solid rgba(30, 117, 239, 0.327);
        background: var(--page-a);
        color: #000000;
        padding: 11px 16px;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        
      }

      .add-task-btn:hover {
        background: #f7fcfb;
        color: var(--focus);
        border: 1px solid rgba(30, 117, 239, 0.255);
      }

      .save-button {
        background: var(--focus);
        color: #fff;
        border-color: var(--focus);
      }

      .edit-form {
        display: none;
        margin-top: 18px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.72);
      }

      .edit-form.is-open {
        display: block;
      }

      .edit-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .field {
        display: grid;
        gap: 8px;
        min-width: 0;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      .form-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 16px;
      }

      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }

      @media (max-width: 640px) {
        article[data-testid="test-todo-card"] {
          border-radius: 22px;
          padding: 20px 18px;
        }

        .card-top {
          align-items: flex-start;
        }

        .edit-grid {
          grid-template-columns: 1fr;
        }

        .button-row button,
        .form-actions button {
          flex: 1 1 100%;
          min-width: 0;
        }
      }

      @media (max-width: 340px) {
        .card-top {
          flex-direction: column;
          gap: 12px;
        }

        .meta-row {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <article
        data-testid="test-todo-card"
        id="todoCard"
        class="priority-high"
        aria-labelledby="todoTitle"
      >
        <div class="card-top">
          <div class="complete-wrap">
            <input type="checkbox" id="todoComplete" data-testid="test-todo-complete-toggle" />
            <label for="todoComplete">Mark as done</label>
          </div>

          <div class="meta-row" aria-label="Task metadata">
            <span
              class="priority-dot"
              data-testid="test-todo-priority-indicator"
              id="priorityIndicator"
              aria-hidden="true"
            ></span>
            <span class="badge priority-badge" data-testid="test-todo-priority" id="todoPriority">High</span>
            <span class="badge status-progress" data-testid="test-todo-status" id="todoStatus">In Progress</span>
          </div>
        </div>

        <div class="status-control">
          <label for="todoStatusControl">Status</label>
          <select id="todoStatusControl" data-testid="test-todo-status-control" aria-label="Change task status">
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Done">Done</option>
          </select>
        </div>

        <h2 data-testid="test-todo-title" id="todoTitle">Daniel J Task Card</h2>

        <section
          class="collapsible-section"
          data-testid="test-todo-collapsible-section"
          id="todoCollapsibleSection"
        >
          <p data-testid="test-todo-description" id="todoDescription"></p>
        </section>

        <button
          type="button"
          class="expand-button"
          data-testid="test-todo-expand-toggle"
          id="expandToggle"
          aria-expanded="false"
          aria-controls="todoCollapsibleSection"
        >
          Show more
        </button>

        <section class="timeline" aria-label="Deadline information">
          <p class="timeline-label">Deadline</p>
          <time data-testid="test-todo-due-date" id="todoDueDate" datetime=""></time>
          <time
            data-testid="test-todo-time-remaining"
            id="todoTimeRemaining"
            datetime=""
            aria-live="polite"
          ></time>
          <span class="overdue-badge" data-testid="test-todo-overdue-indicator" id="overdueIndicator" hidden>
            Overdue
          </span>
        </section>

        <ul data-testid="test-todo-tags" id="todoTags" role="list" aria-label="Task tags">
          <li data-testid="test-todo-tag-work">Work</li>
          <li data-testid="test-todo-tag-urgent">Urgent</li>
          <li>Design</li>
        </ul>

        <div class="button-row">
          <button type="button" data-testid="test-todo-addTask-button" id="addTaskButton" class="add-task-btn">Add Task</button>
          <button type="button" data-testid="test-todo-edit-button" id="editButton">Edit</button>
          <button type="button" data-testid="test-todo-delete-button" id="deleteButton" class="danger-button">Delete</button>
        </div>

        <form
          class="edit-form"
          data-testid="test-todo-edit-form"
          id="editForm"
          aria-label="Edit todo task"
          aria-hidden="true"
        >
          <div class="edit-grid">
            <div class="field full">
              <label for="editTitle">Title</label>
              <input id="editTitle" data-testid="test-todo-edit-title-input" type="text" required />
            </div>

            <div class="field full">
              <label for="editDescription">Description</label>
              <textarea id="editDescription" data-testid="test-todo-edit-description-input" required></textarea>
            </div>

            <div class="field">
              <label for="editPriority">Priority</label>
              <select id="editPriority" data-testid="test-todo-edit-priority-select">
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
              </select>
            </div>

            <div class="field">
              <label for="editDueDate">Due date</label>
              <input id="editDueDate" data-testid="test-todo-edit-due-date-input" type="datetime-local" required />
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="save-button" data-testid="test-todo-save-button" id="saveButton">Save</button>
            <button type="button" data-testid="test-todo-cancel-button" id="cancelButton">Cancel</button>
          </div>
        </form>
      </article>
    </main>

    <script>
      const DESCRIPTION_LIMIT = 150;

      const task = {
        title: "Daniel J Task Card",
        description:
          "Refine the todo card with accessible controls, responsive spacing, clear status cues, editable content, synchronized status controls, and a live due-date hint that stays helpful even when the task description becomes very long on smaller screens.",
        priority: "High",
        status: "In Progress",
        dueDate: new Date(Date.now() + (2 * 24 + 3) * 60 * 60 * 1000).toISOString(),
        tags: ["Work", "Urgent", "Design"]
      };

      let isExpanded = task.description.length <= DESCRIPTION_LIMIT;
      let editSnapshot = null;

      const card = document.getElementById("todoCard");
      const completeToggle = document.getElementById("todoComplete");
      const statusControl = document.getElementById("todoStatusControl");
      const priorityIndicator = document.getElementById("priorityIndicator");
      const priorityLabel = document.getElementById("todoPriority");
      const statusLabel = document.getElementById("todoStatus");
      const title = document.getElementById("todoTitle");
      const description = document.getElementById("todoDescription");
      const collapsibleSection = document.getElementById("todoCollapsibleSection");
      const expandToggle = document.getElementById("expandToggle");
      const dueDate = document.getElementById("todoDueDate");
      const timeRemaining = document.getElementById("todoTimeRemaining");
      const overdueIndicator = document.getElementById("overdueIndicator");
      const editButton = document.getElementById("editButton");
      const deleteButton = document.getElementById("deleteButton");
      const editForm = document.getElementById("editForm");
      const editTitle = document.getElementById("editTitle");
      const editDescription = document.getElementById("editDescription");
      const editPriority = document.getElementById("editPriority");
      const editDueDate = document.getElementById("editDueDate");
      const saveButton = document.getElementById("saveButton");
      const cancelButton = document.getElementById("cancelButton");

      function formatDate(date) {
        return new Intl.DateTimeFormat("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric"
        }).format(date);
      }

      function formatForInput(isoDate) {
        const date = new Date(isoDate);
        const localDate = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
        return localDate.toISOString().slice(0, 16);
      }

      function plural(value, unit) {
        return value === 1 ? unit : unit + "s";
      }

      function getRelativeTime(now, target) {
        if (task.status === "Done") {
          return "Completed";
        }

        const diff = target.getTime() - now.getTime();
        const abs = Math.abs(diff);
        const minute = 60 * 1000;
        const hour = 60 * minute;
        const day = 24 * hour;
        const prefix = diff < 0 ? "Overdue by " : "Due in ";

        if (abs < minute) {
          return diff < 0 ? "Overdue by 1 minute" : "Due now!";
        }

        if (abs >= day) {
          const days = Math.floor(abs / day);
          return prefix + days + " " + plural(days, "day");
        }

        if (abs >= hour) {
          const hours = Math.floor(abs / hour);
          return prefix + hours + " " + plural(hours, "hour");
        }

        const minutes = Math.max(1, Math.floor(abs / minute));
        return prefix + minutes + " " + plural(minutes, "minute");
      }

      function getStatusClass(status) {
        if (status === "Done") return "status-done";
        if (status === "In Progress") return "status-progress";
        return "status-pending";
      }

      function syncStatus(status) {
        task.status = status;
        completeToggle.checked = status === "Done";
        render();
      }

      function renderCollapse() {
        const shouldCollapse = task.description.length > DESCRIPTION_LIMIT;
        const expanded = isExpanded || !shouldCollapse;

        collapsibleSection.classList.toggle("is-collapsed", !expanded);
        collapsibleSection.classList.toggle("is-expanded", expanded);
        expandToggle.hidden = !shouldCollapse;
        expandToggle.textContent = expanded ? "Show less" : "Show more";
        expandToggle.setAttribute("aria-expanded", String(expanded));
      }

      function renderTime() {
        const target = new Date(task.dueDate);
        const isDone = task.status === "Done";
        const isOverdue = !isDone && target.getTime() < Date.now();

        dueDate.textContent = "Due " + formatDate(target);
        dueDate.dateTime = target.toISOString();
        timeRemaining.textContent = getRelativeTime(new Date(), target);
        timeRemaining.dateTime = target.toISOString();
        overdueIndicator.hidden = !isOverdue;
        card.classList.toggle("is-overdue", isOverdue);
      }

      function render() {
        title.textContent = task.title;
        description.textContent = task.description;
        priorityLabel.textContent = task.priority;
        statusLabel.textContent = task.status;
        statusControl.value = task.status;
        priorityIndicator.setAttribute("aria-label", task.priority + " priority indicator");

        card.classList.remove("priority-low", "priority-medium", "priority-high", "completed");
        card.classList.add("priority-" + task.priority.toLowerCase());
        card.classList.toggle("completed", task.status === "Done");

        statusLabel.className = "badge " + getStatusClass(task.status);
        completeToggle.checked = task.status === "Done";

        renderCollapse();
        renderTime();
      }

      function openEditMode() {
        editSnapshot = { ...task };
        editTitle.value = task.title;
        editDescription.value = task.description;
        editPriority.value = task.priority;
        editDueDate.value = formatForInput(task.dueDate);
        editForm.classList.add("is-open");
        editForm.setAttribute("aria-hidden", "false");
        editTitle.focus();
      }

      function closeEditMode(restore) {
        if (restore && editSnapshot) {
          Object.assign(task, editSnapshot);
          render();
        }

        editSnapshot = null;
        editForm.classList.remove("is-open");
        editForm.setAttribute("aria-hidden", "true");
        editButton.focus();
      }

      function saveEdit(event) {
        event.preventDefault();

        if (!editTitle.value.trim() || !editDescription.value.trim() || !editDueDate.value) {
          editForm.reportValidity();
          return;
        }

        task.title = editTitle.value.trim();
        task.description = editDescription.value.trim();
        task.priority = editPriority.value;
        task.dueDate = new Date(editDueDate.value).toISOString();
        isExpanded = task.description.length <= DESCRIPTION_LIMIT;
        render();
        closeEditMode(false);
      }

      function trapFormFocus(event) {
        if (!editForm.classList.contains("is-open")) return;

        if (event.key === "Escape") {
          closeEditMode(true);
          return;
        }

        if (event.key !== "Tab") return;

        const focusable = Array.from(
          editForm.querySelectorAll("input, textarea, select, button")
        ).filter((element) => !element.disabled && !element.hidden);

        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }

      completeToggle.addEventListener("change", () => {
        syncStatus(completeToggle.checked ? "Done" : "Pending");
      });

      statusControl.addEventListener("change", () => {
        syncStatus(statusControl.value);
      });

      expandToggle.addEventListener("click", () => {
        isExpanded = !isExpanded;
        renderCollapse();
      });

      editButton.addEventListener("click", openEditMode);
      deleteButton.addEventListener("click", () => {
        if (!window.confirm("Delete this task?")) return;
        task.title = "No task selected";
        task.description = "Use Edit to add new task details.";
        task.priority = "Low";
        task.status = "Pending";
        task.dueDate = new Date(Date.now() + 60 * 60 * 1000).toISOString();
        isExpanded = true;
        render();
      });

      editForm.addEventListener("submit", saveEdit);
      cancelButton.addEventListener("click", () => closeEditMode(true));
      document.addEventListener("keydown", trapFormFocus);

      render();
      window.setInterval(() => {
        if (task.status !== "Done") renderTime();
      }, 30000);

      const addTaskButton = document.getElementById("addTaskButton");

      addTaskButton.addEventListener("click", () => {
        card.classList.remove("hidden");

        // Reset task (fresh form)
        task.title = "New Task";
        task.description = "";
        task.priority = "Low";
        task.status = "Pending";
        task.dueDate = new Date(Date.now() + 60 * 60 * 1000).toISOString();

        render();
        openEditMode(); // auto open form
      });
     
    </script>
  </body>
</html>
